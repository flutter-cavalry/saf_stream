name: saf_stream
description: Read and write Android SAF `DocumentFile`.
version: 3.0.0
homepage: https://github.com/flutter-cavalry/saf_stream

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mgenware_dart_lints: ^8.0.0

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.fluttercavalry.saf_stream
        pluginClass: SafStreamPlugin
